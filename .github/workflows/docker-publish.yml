name: Build & Push Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  # 1. 在 Windows 環境編譯客戶端執行檔 (.exe 與安裝包)
  build-client:
    name: Build Windows Client Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Client Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt

      - name: Build Single Portable EXE
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: |
          chcp 65001 >nul
          python client/build_exe.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows Installer (.exe)
        shell: cmd
        run: |
          chcp 65001 >nul
          set "PATH=C:\Program Files (x86)\Inno Setup 6;%PATH%"
          iscc client/installer.iss
          if exist client\dist_installer\會議錄音_安裝檔.exe (
            copy /y client\dist_installer\會議錄音_安裝檔.exe web\會議錄音_安裝檔.exe
          )

      - name: Upload Client Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-binaries
          path: web/*.exe
          retention-days: 7

  # 2. 將包含客戶端下載的 Web 平台封裝為 Docker 映像檔並推送到 Docker Hub
  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-client
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Client Binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-client-binaries
          path: web/

      - name: List Web Directory Contents
        run: |
          ls -lh web/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'joely1101' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: joely1101/meeting-ai
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
